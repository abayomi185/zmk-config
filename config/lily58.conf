CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# Encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED display - common for both sides
CONFIG_ZMK_DISPLAY=y

# RGB underglow - disabled
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_LED_STRIP=n

# Bluetooth power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# === Central-only (left side with USB) ===
if SHIELD_LILY58_LEFT

CONFIG_ZMK_USB=y
CONFIG_USB_HID_BOOT_PROTOCOL=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

endif # SHIELD_LILY58_LEFT

# Get around Intel AX211 Bluetooth driver issue
# CONFIG_BT_CTLR_PHY_2M=n

