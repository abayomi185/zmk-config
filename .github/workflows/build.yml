name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      keyboard:
        description: Keyboard to build
        type: choice
        default: all
        options:
          - all
          - corne
          - lily58
          - lily58-slim

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'config/west.yml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Build firmware
        env:
          # Pushes and pull requests build every keyboard, so a break in one is caught.
          KEYBOARD: ${{ inputs.keyboard || 'all' }}
        run: |
          keyboards=$KEYBOARD
          if [ "$KEYBOARD" = all ]; then
            keyboards="corne lily58 lily58-slim"
          fi

          mkdir firmware
          for keyboard in $keyboards; do
            nix build -L ".#$keyboard" --out-link "result-$keyboard"
            cp -L "result-$keyboard/zmk_left.uf2" "firmware/${keyboard}_left.uf2"
            cp -L "result-$keyboard/zmk_right.uf2" "firmware/${keyboard}_right.uf2"
          done

          nix build -L .#settings-reset --out-link result-settings-reset
          cp -L result-settings-reset/zmk.uf2 firmware/settings_reset.uf2

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware
          if-no-files-found: error
