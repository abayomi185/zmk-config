name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'config/west.yml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - run: nix build -L .#firmware .#settings-reset --out-link result

      - name: Collect firmware
        run: |
          mkdir firmware
          cp -L result/zmk_left.uf2 firmware/corne_left.uf2
          cp -L result/zmk_right.uf2 firmware/corne_right.uf2
          cp -L result-1/zmk.uf2 firmware/settings_reset.uf2

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware
          if-no-files-found: error
