CONFIG_ZMK_KEYBOARD_NAME="Corne Slim"

# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Increase Bluetooth signal strength - negligible difference in power draw
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Filter occasional double presses from contact bounce on release (default 5)
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Required by &soft_off in the keymap
CONFIG_ZMK_PM_SOFT_OFF=y

# Enable boot protocol usb support
CONFIG_ZMK_USB_BOOT=y

# Milliseconds to wait after a setting change before writing it to flash memory
# CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=30000

# Turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=y

# Get around Intel AX211 Bluetooth driver issue
# Currently only disables 2M PHY support
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Stop macOS from waking on battery reporting
CONFIG_BT_BAS=n

# PIM447 trackball on the right half
CONFIG_ZMK_POINTING=y
